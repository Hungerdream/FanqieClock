name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.10"

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        # Linux: install system libs required by PyQt6 (Ubuntu 24.04 uses libgl1 instead of libgl1-mesa-glx)
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0
        fi
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-timeout
        
    - name: Run tests
      timeout-minutes: 10
      env:
        PYTHONPATH: src
        QT_QPA_PLATFORM: offscreen
        PYTHONUNBUFFERED: "1"
        PYTHONUTF8: "1"
      run: |
        python -m pytest tests -v --timeout=30 -p no:cacheprovider 2>&1 || python -m unittest discover tests -v
